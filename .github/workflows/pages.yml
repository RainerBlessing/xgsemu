name: Browser version (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
      - run: ./build-web.sh
      - run: rm -rf build-web/CMakeFiles build-web/sxcpu build-web/CMakeCache.txt build-web/*.cmake build-web/Makefile build-web/compile_commands.json build-web/xgsemu.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
